name: Notify IndexNow of changed pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Submit changed URLs
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: node scripts/indexnow.mjs
