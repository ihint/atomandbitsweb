name: Inbound agent (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths:
      - "agents/inbound/**"
      - ".github/workflows/inbound-agent.yml"
  pull_request:
    paths:
      - "agents/inbound/**"
      - ".github/workflows/inbound-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inbound-agent-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the Worker tests
        working-directory: agents/inbound
        run: node --test

  deploy:
    needs: test
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: inbound-agent-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.125.0"
          workingDirectory: agents/inbound
          command: deploy
      - name: Report a missing deploy token
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "Inbound agent deploy skipped: add CLOUDFLARE_API_TOKEN to the inbound-agent-production environment." >> "$GITHUB_STEP_SUMMARY"
